[package]
name = "reminder-proof-api"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = "0.10.3"
axum = "0.8.8"
base64 = "0.22.1"
hmac = "0.12.1"
jsonwebtoken = "9.3.1"
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sha1 = "0.10.6"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower_governor = { version = "0.8.0", features = ["axum"] }
tower-http = { version = "0.6.8", features = ["compression-gzip", "fs", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
